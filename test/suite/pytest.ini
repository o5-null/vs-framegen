[pytest]
testpaths = cases
pythonpath = .
norecursedirs = artifacts __pycache__
addopts = -ra --strict-markers --tb=short
markers =
    env: 环境自检，不跑被测链路
    mpv: 需要 mpv.exe（VFI_MPV 或 测试环境\mpv-lazy）
    vs: 需要 VapourSynth / vspipe
    gpu: 需要 NVIDIA GPU 与引擎运行时（vdlssg / RIFE 等）
    data: 需要真实素材（VFI_DATA / 测试数据）
    playkit: 需要 mpv-playkit-pre 的 stage（VFI_PLAYKIT 或 repos\dist\mpv-playkit-pre-*）
    slow: 超过约 10 秒，默认不跑
